<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 21st Birthday Ajoyce!!!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Pacifico&family=Righteous&display=swap');

        :root {
            --primary: #00f0ff;
            --secondary: #ff0055;
            --gold: #ffcf00;
            --bg: #020205;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            overflow: hidden;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
            color: white;
            perspective: 1200px;
            cursor: none; /* Hide default cursor for custom one */
        }

        /* --- CUSTOM CURSOR --- */
        .cursor-dot {
            position: fixed;
            top: 0; left: 0;
            width: 8px; height: 8px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #fff, 0 0 20px var(--primary);
        }
        .cursor-trail {
            position: fixed;
            top: 0; left: 0;
            width: 40px; height: 40px;
            border: 1.5px solid rgba(0, 240, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, border-color 0.2s;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.2);
        }
        /* Cursor expands when hovering over clickable items */
        body.hovering .cursor-trail {
            width: 60px; height: 60px;
            border-color: var(--gold);
            box-shadow: inset 0 0 20px rgba(255, 207, 0, 0.3);
        }

        /* --- IMMERSIVE BACKGROUND & VIGNETTE --- */
        .celebration-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255, 207, 0, 0.04) 0%, transparent 60%);
            z-index: 0;
            animation: breathe 10s ease-in-out infinite alternate;
        }
        
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 2;
        }

        @keyframes breathe {
            0% { transform: scale(1); filter: hue-rotate(0deg); }
            100% { transform: scale(1.15); filter: hue-rotate(20deg); }
        }

        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            mix-blend-mode: screen;
        }

        /* --- INTRO SCREEN WITH AVATAR --- */
        .intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 5, 0.95);
            backdrop-filter: blur(20px);
            z-index: 9998;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s cubic-bezier(0.8, 0, 0.2, 1), transform 1.5s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .avatar-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin-bottom: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 5s ease-in-out infinite;
        }

        /* Dual Spinning High-Tech Rings */
        .avatar-container::before, .avatar-container::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }
        .avatar-container::before {
            top: -15px; left: -15px; right: -15px; bottom: -15px;
            border-top-color: var(--primary);
            border-bottom-color: var(--secondary);
            animation: spin 4s linear infinite;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
        }
        .avatar-container::after {
            top: -25px; left: -25px; right: -25px; bottom: -25px;
            border-left-color: var(--gold);
            border-right-color: rgba(255, 255, 255, 0.3);
            animation: spinReverse 6s linear infinite;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 60px rgba(255, 207, 0, 0.3);
            z-index: 2;
        }

        .intro-title {
            font-family: 'Righteous', cursive;
            font-size: 4rem;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #fff, var(--primary), var(--gold), var(--secondary), #fff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 8px;
            text-transform: uppercase;
            animation: shineText 4s linear infinite;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .enter-btn {
            padding: 18px 65px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 50px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.1);
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .enter-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.6s;
        }

        .enter-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            transform: scale(1.08) translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 240, 255, 0.4), inset 0 0 30px rgba(0, 240, 255, 0.3);
            border-color: #fff;
        }
        .enter-btn:hover::after { left: 100%; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes shineText { to { background-position: 300% center; } }

        /* --- UI CONTROLS --- */
        .ui-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(40px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            opacity: 0;
            pointer-events: none;
            transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1) 0.8s;
        }

        .ui-container.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .buttons-row {
            display: flex;
            gap: 20px;
            background: rgba(20, 20, 25, 0.4);
            padding: 12px 20px;
            border-radius: 50px;
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            padding: 12px 30px;
            font-family: 'Righteous', cursive;
            font-size: 1rem;
            letter-spacing: 3px;
            border-radius: 30px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        .nav-btn.active, .nav-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            text-shadow: 0 0 15px #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 6px; left: 50%; transform: translateX(-50%);
            width: 35%; height: 3px;
            background: var(--gold);
            border-radius: 5px;
            box-shadow: 0 0 12px var(--gold);
        }

        .hint-text {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        /* --- THE MASTERPIECE GLASS OVERLAY CARD --- */
        .card-wrapper {
            position: absolute;
            top: 50%; left: 50%;
            width: 1050px;
            max-width: 95%;
            height: 650px;
            transform: translate(-50%, -50%) perspective(2500px) rotateX(25deg) scale(0.85);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.9s, transform 1.2s cubic-bezier(0.2, 0.9, 0.3, 1.3);
            z-index: 200;
        }

        .card-wrapper.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) perspective(2500px) rotateX(0deg) scale(1);
        }

        .birthday-card {
            width: 100%;
            height: 100%;
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 50px 120px rgba(0,0,0,1), 
                inset 0 0 40px rgba(255,255,255,0.1),
                0 0 80px rgba(0, 240, 255, 0.15);
            overflow: hidden;
            position: relative;
            transform-style: preserve-3d;
        }

        .birthday-card > img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: transform 0.2s ease-out;
            filter: contrast(1.1) saturate(1.1);
        }

        /* Floating Frosted Glass Panel with Cinematic Reflection */
        .glass-panel {
            position: absolute;
            top: 5%; right: 4%;
            width: 48%; height: 90%;
            background: linear-gradient(135deg, rgba(15, 15, 22, 0.8), rgba(5, 5, 10, 0.9));
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: -20px 20px 50px rgba(0,0,0,0.7);
            z-index: 2;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transform: translateZ(60px); 
            overflow: hidden;
        }

        /* Light sweep effect across the glass */
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-25deg);
            animation: glassSweep 7s infinite;
            pointer-events: none;
        }

        @keyframes glassSweep {
            0%, 60% { left: -150%; }
            100% { left: 200%; }
        }

        .glass-panel h2 {
            font-family: 'Pacifico', cursive;
            font-size: 4rem;
            margin: 0 0 25px 0;
            background: linear-gradient(45deg, var(--gold), #ff5e00, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 3px 3px 15px rgba(255, 207, 0, 0.2);
            position: relative;
        }

        .typewriter-text {
            font-size: 1.1rem;
            line-height: 1.9;
            color: #f5f5f5;
            font-weight: 300;
            min-height: 280px;
            letter-spacing: 0.5px;
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            background-color: var(--gold);
            margin-left: 2px;
            animation: blink 0.8s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .close-btn {
            align-self: flex-start;
            margin-top: 25px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 14px 40px;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }
        
        .close-btn:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 0, 85, 0.6), inset 0 2px 5px rgba(255,255,255,0.5);
            border-color: #fff;
        }

        /* Mobile Adjustments */
        @media (max-width: 950px) {
            .glass-panel {
                width: 92%; height: auto;
                bottom: 4%; top: auto;
                left: 4%; right: 4%;
                padding: 30px;
                transform: translateZ(30px);
            }
            .glass-panel h2 { font-size: 3rem; margin-bottom: 15px;}
            .typewriter-text { min-height: 220px; font-size: 0.95rem; line-height: 1.6; }
            .intro-title { font-size: 2.8rem; }
            .avatar-container { width: 180px; height: 180px; }
            .buttons-row { flex-wrap: wrap; justify-content: center; padding: 10px; gap: 10px; }
            .nav-btn { font-size: 0.85rem; padding: 10px 20px; }
            .cursor-dot, .cursor-trail { display: none; } /* Hide custom cursor on mobile */
            body { cursor: auto; }
        }
    </style>
</head>
<body>

    <!-- CUSTOM CURSOR -->
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-trail" id="cursorTrail"></div>

    <!-- VIGNETTE OVERLAY -->
    <div class="vignette"></div>

    <!-- INTRO SCREEN -->
    <div class="intro-screen" id="intro">
        <!-- 'a.jpg' with a fallback -->
        <div class="avatar-container">
            <img src="a.jpg" alt="Ajoyce" onerror="this.src='https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400';">
        </div>
        <div class="intro-title">SYSTEM_INIT: LEVEL 21</div>
        <button class="enter-btn interactive" onclick="startApp()">Unlock The Universe</button>
    </div>

    <!-- BACKGROUND -->
    <div class="celebration-bg"></div>
    <canvas id="canvas"></canvas>

    <!-- THE MASTERPIECE CARD -->
    <div class="card-wrapper" id="cardModal">
        <div class="birthday-card" id="tiltCard">
            <!-- 'a2.jpg' full background image. Fallback provided. -->
            <img id="cardBgImg" src="a2.jpg" alt="Ajoyce 21st" onerror="this.src='https://images.unsplash.com/photo-1530103862676-de8892bc9524?w=1200';">
            
            <div class="glass-panel">
                <h2>Happy 21st!</h2>
                <div class="typewriter-text" id="msgArea"></div>
                <button class="close-btn interactive" onclick="closeLetter()">CONTINUE PARTY</button>
            </div>
        </div>
    </div>

    <!-- NAVIGATION -->
    <div class="ui-container" id="ui">
        <div class="hint-text">✨ Tap the background to ignite the sky ✨</div>
        <div class="buttons-row">
            <button class="nav-btn active interactive" onclick="warpTo('21', this)">LEVEL 21</button>
            <button class="nav-btn interactive" onclick="warpTo('🥂', this)">CHEERS</button>
            <button class="nav-btn interactive" onclick="openLetter(this)">OPEN CARD</button>
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-raising-me-higher-34.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- CUSTOM CURSOR LOGIC ---
        const cursorDot = document.getElementById('cursorDot');
        const cursorTrail = document.getElementById('cursorTrail');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let trailX = mouseX;
        let trailY = mouseY;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorDot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
        });

        // Smooth trailing effect
        function animateCursor() {
            trailX += (mouseX - trailX) * 0.15;
            trailY += (mouseY - trailY) * 0.15;
            cursorTrail.style.transform = `translate(${trailX}px, ${trailY}px) translate(-50%, -50%)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Hover effects for buttons
        document.querySelectorAll('.interactive, button').forEach(el => {
            el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
            el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
        });


        // --- CANVAS PHYSICS ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let fireworks = [];
        let stardust = []; // Ambient background particles
        let isScrambling = false;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStardust();
        }
        window.addEventListener('resize', resize);
        
        // Setup Ambient Stardust
        function initStardust() {
            stardust = [];
            let count = window.innerWidth > 768 ? 150 : 75;
            for(let i=0; i<count; i++) {
                stardust.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    speedY: Math.random() * -0.5 - 0.2,
                    speedX: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.5 + 0.1
                });
            }
        }
        resize();

        window.addEventListener('pointerdown', e => {
            if(document.getElementById('cardModal').classList.contains('active')) return;
            createFirework(e.clientX, e.clientY);
            
            // Add a burst of cursor interaction
            cursorTrail.style.width = '80px';
            cursorTrail.style.height = '80px';
            setTimeout(() => {
                cursorTrail.style.width = '';
                cursorTrail.style.height = '';
            }, 150);
        });

        // Morphing Particles
        class Particle {
            constructor(x, y) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.destX = x;
                this.destY = y;
                this.vx = (Math.random() - 0.5) * 30;
                this.vy = (Math.random() - 0.5) * 30;
                this.size = Math.random() * 2 + 1;
                this.friction = 0.82; 
                this.spring = 0.08;
                this.color = '#fff';
            }
            update() {
                if (isScrambling) {
                    this.vx += (Math.random() - 0.5) * 15;
                    this.vy += (Math.random() - 0.5) * 15;
                } else {
                    let dx = this.destX - this.x;
                    let dy = this.destY - this.y;
                    this.vx += dx * this.spring;
                    this.vy += dy * this.spring;

                    // Mouse Repulsion
                    let mDx = mouseX - this.x;
                    let mDy = mouseY - this.y;
                    let dist = Math.sqrt(mDx*mDx + mDy*mDy);
                    if (dist < 120) {
                        let force = (120 - dist) / 120;
                        let angle = Math.atan2(mDy, mDx);
                        this.vx -= Math.cos(angle) * force * 15;
                        this.vy -= Math.sin(angle) * force * 15;
                    }
                }
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.x += this.vx;
                this.y += this.vy;
            }
            draw() {
                ctx.globalAlpha = 0.5;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI*2);
                ctx.fill();
                
                ctx.globalAlpha = 1.0;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.8, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // Explosive Fireworks
        class FireworkParticle {
            constructor(x, y, isSpark) {
                this.x = x;
                this.y = y;
                let angle = Math.random() * Math.PI * 2;
                let speed = isSpark ? Math.random() * 5 + 2 : Math.random() * 15 + 3;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 2.5 + 1;
                this.life = 1.0;
                this.decay = Math.random() * 0.015 + 0.01;
                
                const colors = ['#00f0ff', '#ff0055', '#ffcf00', '#ffffff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.isSpark = isSpark;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.12; 
                this.vx *= 0.97; 
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.life;
                if(!this.isSpark) {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 1.5, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function createFirework(x, y) {
            for(let i=0; i<70; i++) fireworks.push(new FireworkParticle(x, y, false));
            for(let i=0; i<40; i++) fireworks.push(new FireworkParticle(x, y, true));
        }

        function animate() {
            // Smooth fade for trails
            ctx.fillStyle = 'rgba(2, 2, 5, 0.25)'; 
            ctx.fillRect(0, 0, width, height);

            // Draw Stardust
            stardust.forEach(star => {
                star.y += star.speedY;
                star.x += star.speedX;
                if(star.y < 0) {
                    star.y = height;
                    star.x = Math.random() * width;
                }
                ctx.globalAlpha = star.opacity;
                ctx.fillStyle = '#ffcf00';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            particles.forEach(p => { p.update(); p.draw(); });
            
            for(let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if(fireworks[i].life <= 0) fireworks.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        animate();

        // --- MORPHING LOGIC ---
        function warpTo(text, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            closeLetter();
            
            isScrambling = true;
            setTimeout(() => {
                isScrambling = false;
                calculateTargets(text);
                createFirework(width/2, height/2);
            }, 500);
        }

        function calculateTargets(text) {
            let tCanvas = document.createElement('canvas');
            let tCtx = tCanvas.getContext('2d');
            tCanvas.width = width;
            tCanvas.height = height;

            let fontSize = Math.min(width / 2.5, 320);
            if(text === '🥂') fontSize = Math.min(width / 3, 220);

            tCtx.font = `900 ${fontSize}px Righteous, Arial`;
            tCtx.fillStyle = 'white';
            tCtx.textAlign = 'center';
            tCtx.textBaseline = 'middle';
            tCtx.fillText(text, width/2, height/2);

            let data = tCtx.getImageData(0, 0, width, height).data;
            let step = window.innerWidth > 768 ? 6 : 9; 
            let newTargets = [];

            for(let y=0; y<height; y+=step) {
                for(let x=0; x<width; x+=step) {
                    if(data[(y*width+x)*4+3] > 128) {
                        let pct = x / width;
                        let color = (text === '21') 
                            ? (pct < 0.5 ? '#ffcf00' : '#ff0055') 
                            : (Math.random() > 0.5 ? '#00f0ff' : '#ffffff');
                        newTargets.push({x, y, color});
                    }
                }
            }

            newTargets.sort(() => Math.random() - 0.5);

            if (particles.length < newTargets.length) {
                for (let i = particles.length; i < newTargets.length; i++) {
                    particles.push(new Particle(width/2, height/2));
                }
            } else {
                particles.splice(newTargets.length);
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].destX = newTargets[i].x;
                particles[i].destY = newTargets[i].y;
                particles[i].color = newTargets[i].color;
            }
        }

        // --- 3D CINEMATIC TILT ---
        const cardWrapper = document.getElementById('cardModal');
        const card = document.getElementById('tiltCard');
        const cardImg = document.getElementById('cardBgImg');
        
        document.addEventListener('mousemove', (e) => {
            if(!cardWrapper.classList.contains('active')) return;
            
            let rect = cardWrapper.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            let centerX = rect.width / 2;
            let centerY = rect.height / 2;
            
            let rotateX = ((y - centerY) / centerY) * -12; 
            let rotateY = ((x - centerX) / centerX) * 12;
            
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            cardImg.style.transform = `scale(1.08) translate(${rotateY * -0.6}px, ${rotateX * 0.6}px)`; 
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            cardImg.style.transform = `scale(1) translate(0,0)`;
        });

        // --- CARD / TYPEWRITER LOGIC ---
        function openLetter(btnElement) {
            if(btnElement) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
            
            isScrambling = true;
            setTimeout(() => {
                isScrambling = false;
                particles.forEach(p => {
                    p.destX = Math.random() * width;
                    p.destY = Math.random() * height;
                    p.color = '#fff';
                    p.size = Math.random() * 1.2;
                });
            }, 200);

            cardWrapper.classList.add('active');
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            typeWriter();
        }

        function closeLetter() {
            cardWrapper.classList.remove('active');
        }

        let typed = false;
        function typeWriter() {
            if(typed) return;
            const text = "Welcome to Chapter 21 Baby!! 🥂✨\n\nA brand new chapter begins today, filled with endless opportunities, exciting adventures, and memories waiting to be made.\n\nYou've grown into an amazing person, and everyone who's lucky enough to know you is better for it, especially me. Here's to chasing dreams, embracing every moment, and celebrating every little victory along the way.\n\nCheers to the nights we won't remember, with the friends we'll never forget. 🍻\n\nHappy 21st Birthday! Today is all about celebrating you. Wishing you a year filled with happiness, success, laughter, and unforgettable moments with or without me. Make every page of this new chapter count! 🎉🎂";
            
            const el = document.getElementById('msgArea');
            el.innerHTML = "";
            let i = 0;
            
            let interval = setInterval(() => {
                if(i < text.length) {
                    let char = text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
                    // Add the character, then add the blinking cursor span
                    el.innerHTML = el.innerHTML.replace('<span class="cursor-blink">|</span>', '');
                    el.innerHTML += char + '<span class="cursor-blink">|</span>';
                    i++;
                } else {
                    clearInterval(interval);
                    typed = true;
                }
            }, 30);
        }

        // --- SYSTEM BOOT ---
        function startApp() {
            const intro = document.getElementById('intro');
            intro.style.transform = 'scale(1.5) translateY(-50px)';
            intro.style.opacity = 0;
            
            // Add a massive screen-clearing firework at the center
            createFirework(width/2, height/2);
            setTimeout(() => createFirework(width/3, height/3), 200);
            setTimeout(() => createFirework(width*0.6, height*0.7), 400);

            setTimeout(() => {
                intro.style.display = 'none';
                document.getElementById('ui').classList.add('visible');
                
                let bgMusic = document.getElementById('bgMusic');
                bgMusic.volume = 0.5;
                bgMusic.play().catch(e => console.log("Audio prevented."));

                warpTo('21');
            }, 1000);
        }
    </script>
</body>
